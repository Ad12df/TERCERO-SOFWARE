<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BiblioTech — Recuperar contraseña</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/forgot-password.css" />
  <link rel="manifest" href="manifest.json" />
  <!-- PWA: tema y icono -->
  <meta name="theme-color" content="#1E4B65" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
</head>
<body class="auth-page">

  <div class="auth-wrapper">
    <div class="form-container">
      <div class="form-panel">

        <!-- ─── Encabezado ─────────────────────────────────── -->
        <h1 class="form-title">¿Olvidaste tu contraseña?</h1>
        <p class="form-subtitle">
          Ingresa tu correo electrónico y te enviaremos un enlace
          para restablecer tu contraseña.
        </p>

        <!-- ─── Formulario ─────────────────────────────────── -->
        <form id="forgotPasswordForm" class="auth-form" novalidate>
          <!-- Correo electrónico -->
          <div class="input-pill has-icon">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="correo@ejemplo.com"
              required
              autocomplete="email"
              maxlength="255"
            />
          </div>

          <!-- Mensaje de validación / estado -->
          <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>

          <!-- Botón de envío -->
          <div class="btn-row">
            <button type="submit" id="submitBtn" class="btn-pill btn-primary">
              <span id="btnText">Enviar enlace</span>
              <span id="btnSpinner" class="spinner" hidden></span>
            </button>
          </div>
        </form>

        <!-- ─── Enlace de regreso ──────────────────────────── -->
        <p class="form-switch">
          ¿Recordaste tu contraseña?
          <a href="index.html" class="link-action">Iniciar sesión</a>
        </p>

      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
