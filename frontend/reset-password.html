<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click y Lee — Restablecer contraseña</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/forgot-password.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#784A33" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
</head>
<body class="auth-page">

  <div class="auth-wrapper">
    <div class="form-container">
      <div class="form-panel">

        <!-- ─── Encabezado ─────────────────────────────────── -->
        <h1 class="form-title">Restablecer contraseña</h1>
        <p class="form-subtitle">
          Ingresa tu nueva contraseña para recuperar el acceso a tu cuenta.
        </p>

        <!-- ─── Formulario ─────────────────────────────────── -->
        <form id="resetPasswordForm" class="auth-form" novalidate>
          <!-- Token (oculto, viene de la URL) -->
          <input type="hidden" id="token" name="token" value="" />

          <!-- Nueva contraseña -->
          <div class="input-pill has-icon">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              placeholder="Nueva contraseña (mín. 6 caracteres)"
              required
              autocomplete="new-password"
              minlength="6"
              maxlength="100"
            />
          </div>

          <!-- Confirmar contraseña -->
          <div class="input-pill has-icon">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirmar nueva contraseña"
              required
              autocomplete="new-password"
              minlength="6"
              maxlength="100"
            />
          </div>

          <!-- Mensaje de validación / estado -->
          <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>

          <!-- Botón de envío -->
          <div class="btn-row">
            <button type="submit" id="submitBtn" class="btn-pill btn-primary">
              <span id="btnText">Restablecer contraseña</span>
              <span id="btnSpinner" class="spinner" hidden></span>
            </button>
          </div>
        </form>

        <!-- ─── Enlace de regreso ──────────────────────────── -->
        <p class="form-switch">
          <a href="index.html" class="link-action">Volver a iniciar sesión</a>
        </p>

      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
